<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HadronDB</title>
    <meta name="description" content="How Windows games run on Apple silicon Macs with Hadron: community reports, ratings and settings.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!--page-meta-->
    <script>
      // Apply the saved theme before the first paint, so a dark page doesn't flash light.
      (function () {
        var t = null;
        try { t = localStorage.getItem("hadrondb-theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>HadronDB needs JavaScript to show its reports. The data is also in the repository's data/ folder.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
